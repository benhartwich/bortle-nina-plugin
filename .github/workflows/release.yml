# Build and release on a version tag, following the N.I.N.A. team's template
# (isbeorn/nina.plugin.manifests, tools/github-action.yaml). The tag must be the
# plugin's AssemblyVersion, e.g. "0.1.0.0".
#
# The template's last step — opening a pull request against the manifest
# repository automatically — is left out on purpose: submitting is the
# maintainer's own declaration that he reviewed and tested this release.
name: Build and Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

env:
  PLUGIN_NAME: "Bortle"
  PLUGIN_DLL_NAME: "Bortle.NinaPlugin"

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: The tag is the assembly version
        shell: pwsh
        run: |
          $info = Get-Content src/Bortle.NinaPlugin/Properties/AssemblyInfo.cs -Raw
          $version = [regex]::Match($info, 'AssemblyVersion\("([0-9.]+)"\)').Groups[1].Value
          if ($version -ne "${{ github.ref_name }}") {
            throw "tag ${{ github.ref_name }} does not match AssemblyVersion $version"
          }

      - name: Test the core
        run: dotnet test tests/Bortle.Capture.Core.Tests -c Release --filter "Category!=E2E"

      - name: Build
        run: dotnet build src/Bortle.NinaPlugin -c Release -o ./bin/Release

      # Only our own assemblies: N.I.N.A. ships everything they reference.
      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "packages/${{ env.PLUGIN_NAME }}" | Out-Null
          foreach ($name in @("${{ env.PLUGIN_DLL_NAME }}", "Bortle.Capture.Core")) {
            Copy-Item "bin/Release/$name.dll" "packages/${{ env.PLUGIN_NAME }}/" -Force
            Copy-Item "bin/Release/$name.pdb" "packages/${{ env.PLUGIN_NAME }}/" -Force
          }

      - name: Create plugin archive and manifest
        shell: pwsh
        run: |
          curl -L -o CreateManifest.ps1 https://raw.githubusercontent.com/isbeorn/nina.plugin.manifests/refs/heads/main/tools/CreateManifest.ps1
          pwsh CreateManifest.ps1 -file "packages/${{ env.PLUGIN_NAME }}/${{ env.PLUGIN_DLL_NAME }}.dll" -installerUrl "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ env.PLUGIN_DLL_NAME }}.${{ github.ref_name }}.zip" -createArchive -includeAll
          Rename-Item -Path "manifest.json" -NewName "${{ env.PLUGIN_DLL_NAME }}.${{ github.ref_name }}.manifest.json"
          Rename-Item -Path "${{ env.PLUGIN_DLL_NAME }}.zip" -NewName "${{ env.PLUGIN_DLL_NAME }}.${{ github.ref_name }}.zip"
          Get-FileHash "${{ env.PLUGIN_DLL_NAME }}.${{ github.ref_name }}.zip" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  ${{ env.PLUGIN_DLL_NAME }}.${{ github.ref_name }}.zip" } | Set-Content -NoNewline "${{ env.PLUGIN_DLL_NAME }}.${{ github.ref_name }}.sha256"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Bortle ${{ github.ref_name }}
          # 0.x: not yet proven in a real night
          prerelease: ${{ startsWith(github.ref_name, '0.') }}
          files: |
            ./${{ env.PLUGIN_DLL_NAME }}.${{ github.ref_name }}.zip
            ./${{ env.PLUGIN_DLL_NAME }}.${{ github.ref_name }}.manifest.json
            ./${{ env.PLUGIN_DLL_NAME }}.${{ github.ref_name }}.sha256
